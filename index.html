<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Simpel Spenzaga</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#4f6bff;--teal:#12c4b0;--warm:#ff8a5b;--sun:#ffc83d;--pink:#ff6b9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--card:#fff;--ink:#172036;--mut:#6b7a99;--line:#e6ebf5;--soft:#eef2ff;--sh:0 2px 10px rgba(30,50,120,.07)}
:root[data-theme="dark"]{--bg:#0e1429;--card:#182041;--ink:#eaf0ff;--mut:#9aa8c9;--line:#27315c;--soft:#252f5c;--sh:0 6px 20px rgba(0,0,0,.3);--pri:#6580ff}
.card,.item{border:1px solid var(--line)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
header h1{font-size:18px;margin:0;flex:1;font-weight:800}
.ib{width:42px;height:42px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:18px;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:4px 16px 100px}
.hero{background:linear-gradient(135deg,#4f6bff,#12c4d8);color:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 28px rgba(79,107,255,.28)}
.hero h2{margin:2px 0;font-size:22px}.hero p{margin:0;opacity:.9}.hero small{opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.st{border-radius:18px;padding:14px;color:#fff;font-size:12px;font-weight:700}.st b{display:block;font-size:26px}
.s1{background:#4f6bff}.s2{background:#12c4b0}.s3{background:#ff8a5b}
h3{font-size:15px;margin:20px 0 10px;display:flex;justify-content:space-between}h3 a{color:var(--pri);font-size:13px}
.pt{margin:8px 0 14px;font-size:22px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{border:0;border-radius:18px;padding:14px 6px;background:var(--card);box-shadow:var(--sh);font:700 13px inherit;color:var(--ink);font-size:24px}
.qa span{display:block;font-size:13px;margin-top:4px}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 15px inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:16px;padding:13px;background:var(--pri);color:#fff;font:800 15px inherit;box-shadow:0 8px 18px rgba(79,107,255,.3);margin-top:6px}
.btn.g{background:var(--card);color:var(--pri);box-shadow:none;border:1.5px solid var(--pri)}.btn.r{background:#ff5d6c;box-shadow:none}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mut);font-weight:600}
.av{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.x{border:0;background:none;color:#ff5d6c;font-size:18px}
.chips{display:flex;gap:6px}.chip{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font:800 13px inherit;color:var(--mut)}
.chip.on{color:#fff;border-color:transparent}.cH.on{background:#12c4b0}.cS.on{background:#ffc83d;color:#5a4300}.cI.on{background:#4f6bff}.cA.on{background:#ff5d6c}
.sum{display:flex;gap:8px;margin-bottom:10px}.sum span{flex:1;text-align:center;border-radius:12px;padding:8px;font-weight:800;font-size:12px;background:var(--card)}
.empty{text-align:center;color:var(--mut);padding:22px;background:var(--card);border-radius:18px;border:1.5px dashed var(--line)}
.num{width:84px;text-align:center;margin:0}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--pri)}
nav.bn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
nav.bn button{border:0;background:none;font:700 11px inherit;color:var(--mut);padding:4px 10px;border-radius:14px}nav.bn i{display:block;font-style:normal;font-size:20px}
nav.bn .on{color:var(--pri);background:var(--soft)}
#ov{position:fixed;inset:0;background:rgba(15,25,60,.4);opacity:0;pointer-events:none;transition:.25s;z-index:8}
#dr{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82%;background:var(--card);z-index:9;transform:translateX(-105%);transition:.25s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;overflow:auto}
.open #ov{opacity:1;pointer-events:auto}.open #dr{transform:none}
#dr h4{margin:0 8px 14px;font-size:18px}#dr button{display:flex;gap:12px;width:100%;border:0;background:none;padding:12px;border-radius:14px;font:700 15px inherit;color:var(--ink);text-align:left}
#dr .on{background:var(--soft);color:var(--pri)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th{background:var(--soft);color:var(--pri)}td:nth-child(2),th:nth-child(2){text-align:left}
.lg header,.lg nav.bn,.lg #dr{display:none}
.tg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172036;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:20}
@media print{header,nav.bn,#dr,#ov,.np{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}
</style></head><body>
<div id="app"><div id="ov" onclick="tg()"></div>
<aside id="dr"></aside>
<header><button class="ib" onclick="tg()">☰</button><h1 id="ttl">Beranda</h1><button class="ib" data-tb onclick="toggleTheme()"></button><span class="tag" id="sy" onclick="doSync()">Lokal</span></header>
<main id="main"></main>
<nav class="bn" id="bn"></nav></div>

function addCls(){const v=$('#f1').value.trim();if(!v)return;db.cls.push({id:uid(),name:v});save();render()}
function addSub(){const v=$('#f1').value.trim();if(!v)return;db.sub.push({id:uid(),name:v});save();render()}

 db.jur.push({id:uid(),date:ui.date,cid:hd?ui.cid:'',mid:hd?ui.mid:'',jam:[...ui.jam].sort((a,b)=>a-b),ket:ui.ket,mat:m,keg:(ui.jk||'').trim()});ui.jm='';ui.jk='';ui.jam=[];save();render();toast('Jurnal tersimpan')}
function togJam(n,b){const i=ui.jam.indexOf(n);i<0?ui.jam.push(n):ui.jam.splice(i,1);b.classList.toggle('on')}
function addGw(){const n=$('#gm').value,a=$('#ga').value,c=$('#gc').value.trim();if(!n||!a||!c)return toast('Pilih murid, aspek, dan isi catatan');db.gw.push({id:uid(),nis:n,date:$('#gd').value,aspek:a,cat:c,tl:$('#gt').value.trim()});save();render();toast('Catatan tersimpan')}
function delGw(id){db.gw=db.gw.filter(x=>x.id!=id);save();render()}
async function loadMon(){ui.tried=1;if(!API)return toast('Server belum diatur');if(ui.busy)return;ui.busy=1;setSy('⏳');try{const r=await post({act:'rekap',nip:S.nip,pin:S.ph,tgl:ui.mdate||today()});if(!r.ok)throw r.err;ui.mon=r;setSy('✓')}catch(e){setSy('⚠');toast(typeof e=='string'?e:'Gagal memuat rekap')}ui.busy=0;if(page=='mon')render()}
function addCat(){const s=$('#cs').value,t=$('#ct').value.trim();if(!s||!t)return toast('Lengkapi data');db.cat.push({id:uid(),sid:s,jenis:$('#cj').value,txt:t,date:today()});save();render();toast('Catatan tersimpan')}
function del(c,id){db[c]=db[c].filter(x=>x.id!=id);if(c=='cls'){db.stu=db.stu.filter(s=>s.cid!=id);db.sch=db.sch.filter(s=>s.cid!=id)}save();render()}

function allH(){const k=akey();db.att[k]={};stuOf().forEach(s=>db.att[k][s.id]='H');save();render()}

const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}};
const setSy=t=>{SY=t;const e=$('#sy');if(e)e.textContent=t};
function loginHtml(){return `<button class="ib" data-tb style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px" onclick="toggleTheme()"></button>
<div style="text-align:center;margin:34px 0 18px"><img src="${LOGO}" height="120" alt="Logo SMP Negeri 1 Purbalingga"><h1 style="margin:12px 0 4px;font-size:30px;font-weight:800;background:linear-gradient(90deg,#4f6bff,#12c4b0);-webkit-background-clip:text;background-clip:text;color:transparent">Simpel Spenzaga</h1><p style="margin:0;color:var(--mut);font-style:italic">“${TAG}”</p></div>
<div class="card"><b style="font-size:17px">Masuk Guru</b><label style="margin-top:10px">Username (NIP)<input id="ln" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label>${API0?'':`<label>URL Apps Script (isi sekali)<input id="la" value="${esc(API)}" placeholder="https://script.google.com/macros/s/.../exec"></label>`}<button class="btn" onclick="login()">Masuk</button><p style="color:var(--mut);font-size:13px">Akun dibuat oleh admin sekolah. Lupa password? Hubungi admin atau Kurikulum.</p></div>`}
async function login(){const nip=$('#ln').value.trim(),pw=$('#lp').value;
 if(!nip||!pw)return toast('Isi username dan password');
 const u=$('#la');if(u){API=u.value.trim();W('guruku_api',API)}
 const ph=await sha(nip+':'+pw),acc=L('guruku_acc_'+nip);let nama,role;
 try{if(!API)throw 0;const r=await post({act:'login',nip,pin:ph});if(!r.ok)return toast(r.err);nama=r.nama;role=r.role}
 catch(e){if(acc&&acc.ph==ph){nama=acc.nama;role=acc.role}else return toast(API?'Tidak bisa terhubung ke server':'Server belum diatur')}
 W('guruku_acc_'+nip,{nama,ph,role});S={nip,nama,ph,role};W('guruku_sess',S);
 db=Object.assign({},def,L(K+nip)||{});db.me=db.me||nama;
 if(API)await pull(1);render();toast('Selamat datang, '+nama)}
function logout(){S=null;localStorage.removeItem('guruku_sess');db=Object.assign({},def);page='home';render()}
async function pull(q){if(!API||!S)return;setSy('⏳');try{const r=await post({act:'pull',nip:S.nip,pin:S.ph});if(!r.ok)throw 0;if(r.json){const d=JSON.parse(r.json);if((d.ts||0)>(db.ts||0)){db=Object.assign({},def,d);W(K+S.nip,db);if(!q)toast('Data terbaru ditarik')}}applyMaster(r);setSy('✓')}catch(e){setSy('⚠');if(!q)toast('Gagal menarik data')}}
function push(d){if(!API||!S)return;clearTimeout(T);setSy('⏳');T=setTimeout(doPush,d?3000:0)}
async function doPush(){try{const r=await post({act:'push',nip:S.nip,nama:S.nama,pin:S.ph,json:JSON.stringify(Object.assign({},db,{cls:[],stu:[],mb:[]})),flat:flat()});setSy(r.ok?'✓':'⚠');return r.ok}catch(e){setSy('⚠')}}
async function doSync(){if(!API)return toast('Server belum diatur');await pull();const ok=await doPush();render();toast(ok?'Sinkron selesai':'Gagal sinkron')}
function flat(){const g=S.nama,n=S.nip,A=[],N=[],J=[],PD=[];
 Object.keys(db.att).forEach(k=>{const[d,c,m]=k.split('|');Object.entries(db.att[k]).forEach(([s,v])=>v&&A.push([n,g,d,nm('cls',c),m=='harian'?'Harian':nm('sub',m),nm('stu',s),v]))});
 Object.keys(db.gr).forEach(k=>{const[c,m,t]=k.split('|');Object.entries(db.gr[k]).forEach(([s,v])=>N.push([n,g,nm('cls',c),nm('sub',m),t,nm('stu',s),v]))});
 db.jur.forEach(j=>J.push([n,g,j.date,j.cid?nm('cls',j.cid):'',j.mid?nm('sub',j.mid):'',(j.jam||[]).join(','),j.ket||'Hadir',j.mat,j.keg]));
 db.gw.forEach(x=>{const m=db.mb.find(b=>b.nis==x.nis)||{};PD.push([n,g,x.date,x.nis,m.nama||'',m.kelas||'',x.aspek,x.cat,x.tl])});
 return{Absensi:A,Nilai:N,Jurnal:J,Pendampingan:PD}}
const kset=()=>`<div class="card"><label>Tema tampilan<select onchange="db.theme=this.value;W('guruku_theme',db.theme);save();applyTheme()"><option value="dark" ${db.theme!='light'?'selected':''}>🌙 Gelap</option><option value="light" ${db.theme=='light'?'selected':''}>☀️ Terang</option></select></label></div><div class="card"><b>👤 Akun</b><p style="color:var(--mut);margin:6px 0">${esc(S.nama)}<br>Kepala Sekolah</p><button class="btn g" onclick="logout()">Keluar</button></div>`;
P.set=()=>S.role=='kepsek'?kset():P.set0();
const MAPEL=['Bahasa Indonesia','PAI & Budi Pekerti','PAK & Budi Pekerti','Katolik & Budi Pekerti','Matematika','Pendidikan Pancasila','Bahasa Inggris','Prakarya','Seni Musik','Seni Rupa','IPA','PJOK','IPS','Bahasa Jawa','Informatika','BK'];
function applyMaster(r){if(r.mb)db.mb=r.mb;db.wk=r.wk||[];const m=r.mst;
 if(m&&m.kls.length){if(!db.master){db.att={};db.gr={};db.sch=[]}
  db.sch=db.sch.filter(x=>m.kls.includes(x.cid));db.jur.forEach(j=>{if(j.cid&&!m.kls.includes(j.cid))j.cid=''});
  db.cls=m.kls.map(k=>({id:k,name:k}));db.stu=m.stu.map(x=>({id:x[0],cid:x[2],name:x[1],gw:x[3]}));db.master=1;
  if(!db.sub.length)db.sub=MAPEL.map(n=>({id:n,name:n}))}
 W(K+S.nip,db)}
const P_siswa=P.siswa;
P.kelas=()=>`<div class="card"><small style="color:var(--mut)">Daftar kelas diambil otomatis dari data sekolah.</small></div>`+(db.cls.map(x=>`<div class="item"><div class="av">${esc(x.name.slice(0,2))}</div><div class="grow"><b>${esc(x.name)}</b><small>${db.stu.filter(s=>s.cid==x.id).length} siswa</small></div></div>`).join('')||'<div class="empty">Data kelas belum tersedia. Ketuk lencana ☁️ untuk sinkron.</div>');
P.siswa=()=>db.master?`<div class="card">${sel('Kelas','cid',db.cls)}<small style="color:var(--mut)">Data siswa diambil otomatis dari data sekolah.</small></div>`+(stuOf().map((s,i)=>`<div class="item"><div class="av">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><small>NIS ${esc(s.id)}${s.gw?' · Guru wali: '+esc(s.gw):''}</small></div></div>`).join('')||'<div class="empty">Belum ada siswa.</div>'):P_siswa();
P.wk=()=>{const wk=db.wk||[];ui.wkc=wk.includes(ui.wkc)?ui.wkc:wk[0];if(!ui.wkc)return '<div class="empty">Anda belum tercatat sebagai wali kelas.</div>';
const st=db.stu.filter(s=>s.cid==ui.wkc),a=db.att[wkey()]||{},c=x=>st.filter(s=>a[s.id]==x).length,r=ui.wk&&ui.wk.kelas==ui.wkc&&ui.wk.bln==ui.month?ui.wk.rekap:null;
return `<div class="card">${wk.length>1?`<label>Kelas<select onchange="ui.wkc=this.value;ui.wk=null;render()">${wk.map(x=>`<option ${x==ui.wkc?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`:`<b style="font-size:17px">Wali Kelas ${esc(ui.wkc)}</b>`}<p style="color:var(--mut);margin:4px 0 0">${st.length} siswa</p></div>
<h3>Absensi harian</h3><div class="card"><label>Tanggal<input type="date" value="${ui.date}" onchange="ui.date=this.value;render()"></label></div>
<div class="sum"><span style="color:#0a9b8a">H ${c('H')}</span><span style="color:#a37800">S ${c('S')}</span><span style="color:#4f6bff">I ${c('I')}</span><span style="color:#ff5d6c">A ${c('A')}</span></div>`+
st.map((s,i)=>`<div class="item"><div class="av">${i+1}</div><div class="grow"><b>${esc(s.name)}</b>${s.gw?`<small>Guru wali: ${esc(s.gw)}</small>`:''}</div><div class="chips">${['H','S','I','A'].map(x=>`<button class="chip c${x} ${a[s.id]==x?'on':''}" onclick="setAttW('${s.id}','${x}')">${x}</button>`).join('')}</div></div>`).join('')+
`<button class="btn g" onclick="allHW()">Hadirkan semua</button>
<h3>Rekap kehadiran gabungan</h3><div class="card np"><label>Bulan<input type="month" value="${ui.month}" onchange="ui.month=this.value;render()"></label><button class="btn" onclick="loadWK()">🔄 Muat rekap semua mapel</button><small style="color:var(--mut)">Dihitung per hari dari absensi semua guru. Prioritas status: A, S, I, H.</small></div>`+
(r?`<div class="card"><div class="tw"><table><tr><th>No</th><th>Nama</th><th>H</th><th>S</th><th>I</th><th>A</th></tr>${[...r].sort((x,y)=>y.A-x.A||y.S+y.I-x.S-x.I).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nama)}${x.A>=3?' ⚠':''}</td><td>${x.H}</td><td>${x.S}</td><td>${x.I}</td><td>${x.A}</td></tr>`).join('')}</table></div></div><small style="color:var(--mut)">⚠ = alfa 3 hari atau lebih</small>`:'')};
const wkey=()=>[ui.date,ui.wkc,'harian'].join('|');
function setAttW(s,v){const k=wkey();db.att[k]=db.att[k]||{};db.att[k][s]=db.att[k][s]==v?'':v;save();render()}
function allHW(){const k=wkey();db.att[k]={};db.stu.filter(s=>s.cid==ui.wkc).forEach(s=>db.att[k][s.id]='H');save();render()}
async function loadWK(){if(!API)return toast('Server belum diatur');setSy('⏳');try{await doPush();const r=await post({act:'wali',nip:S.nip,pin:S.ph,kelas:ui.wkc,bln:ui.month});if(!r.ok)throw r.err;r.kelas=ui.wkc;r.bln=ui.month;ui.wk=r;setSy('✓')}catch(e){setSy('⚠');toast(typeof e=='string'?e:'Gagal memuat rekap')}if(page=='wk')render()}
render();if(S)pull(1).then(render);
</script></body></html>
